name: release build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'architecture'
        required: true
        default: 'all'
        type: choice
        options: [all, arm64, arm]
      chromium_source:
        description: 'chromium source'
        required: true
        default: 'github'
        type: choice
        options: ['github', 'googlesource']
      release_name:
        description: 'release tag (blank = no release)'
        required: false
        default: ''
        type: string
      source_run_id:
        description: 'run id (blank = no resume)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-hosted-${{ inputs.architecture }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ inputs.architecture == 'all' && fromJSON('["arm64","arm"]') || fromJSON(format('["{0}"]', inputs.architecture)) }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-steps.yml
    secrets: inherit
    with:
      architecture: ${{ matrix.architecture }}
      chromium_source: ${{ inputs.chromium_source }}
      source_run_id: ${{ inputs.source_run_id }}

  release:
    needs: build
    if: ${{ inputs.release_name != '' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: rel
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.release_name }}
        run: |
          files=()
          while IFS= read -r f; do files+=("$f"); done < <(find rel -name 'ChromePublic_*.apk' -o -name 'ChromePublic_arm64.aab')
          [ "${#files[@]}" -gt 0 ] || { echo "FATAL: no release files found"; exit 1; }
          printf 'releasing %s with:\n' "$NAME"
          printf '  %s\n' "${files[@]}"
          gh release create "$NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$NAME" \
              --notes "Please see [CHANGELOG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for latest updates."

  notify-failure:
    name: Notify build failure
    needs: [build, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify build failure
        shell: bash
        env:
          NOTIFY_KEY: ${{ secrets.LUMO_BUILD_NOTIFY_KEY }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set +e
          if [ -z "$NOTIFY_KEY" ]; then
            echo "LUMO_BUILD_NOTIFY_KEY not set; skipping build-failure notification."
            exit 0
          fi
          TS=$(date +%s)
          FAILED=$(printf '%s' "$NEEDS_JSON" | jq -r 'to_entries | map(select(.value.result == "failure") | .key) | join(",")')
          MSG="${GITHUB_REPOSITORY}.${GITHUB_RUN_ID}.${TS}"
          SIG=$(printf '%s' "$MSG" | openssl dgst -sha256 -hmac "$NOTIFY_KEY" | awk '{print $NF}')
          BODY=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_number "$GITHUB_RUN_NUMBER" \
            --arg failed "$FAILED" \
            --arg head_sha "$GITHUB_SHA" \
            --argjson ts "$TS" \
            --arg sig "$SIG" \
            '{repo: $repo, workflow: $workflow, run_id: $run_id, run_number: $run_number, conclusion: "failure", failed_jobs: ($failed | split(",") | map(select(length > 0))), head_sha: $head_sha, ts: $ts, sig: $sig}')
          curl --silent --max-time 30 -A "Mozilla/5.0" -H 'content-type: application/json' -d "$BODY" https://lumo-build-notify.l-quiet-relay3813.workers.dev/notify || true
          exit 0
